name: Build Fabric Mod

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: gradle build
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: RandomSlotClear-Fabric-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
